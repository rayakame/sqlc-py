[project]
name = "sqlc-py"
version = "1.29.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rayakame", email = "github.android206@passmail.net" }
]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "setuptools>=80.1.0",
]

[project.scripts]
sqlc = "sqlc_py._bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sqlc_py = ["_vendor/*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pyright]
include = ["src", "setup.py"]
typeCheckingMode = "strict"

